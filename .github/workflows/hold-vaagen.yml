# Holder Supabase-projektet vågent: gratis projekter sættes på pause efter en uge uden aktivitet,
# og så kan gymnasterne ikke se deres spring. Sender et par små forespørgsler hver dag.
# Nøglen er den offentlige (publishable) nøgle, som også står i app.js.
name: Hold Supabase vågen
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          URL=https://njunnxxyidmycxgspybd.supabase.co
          KEY=sb_publishable_z_WF_jwdJPo0_G_gaenMvg_YcBs8GEx
          curl -sS -o /dev/null -w "auth %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -sS -o /dev/null -w "rest %{http_code}\n" "$URL/rest/v1/clips?select=id&limit=1" -H "apikey: $KEY"
